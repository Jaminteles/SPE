name: Publicar APK

# O APK e distribuido fora da loja: este workflow e o que substitui o EAS Build.
# Roda no runner do GitHub — nao consome cota de servico nenhum e nao depende da
# maquina de ninguem.
#
# Dispara por tag `app-v<versao>` (a versao precisa bater com `expo.version` do
# app.json) ou manualmente, para gerar um APK de teste sem criar tag.

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write # necessario para criar o Release e anexar o APK

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/app/package-lock.json

      # O Gradle do React Native 0.76 exige JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Conferir se a tag bate com a versao do app.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declarada=$(node -p "require('./app.json').expo.version")
          da_tag="${GITHUB_REF_NAME#app-v}"
          if [ "$declarada" != "$da_tag" ]; then
            echo "::error::A tag diz $da_tag mas o app.json diz $declarada."
            echo "A verificacao de versao do aplicativo compara com o app.json: publicar"
            echo "com os dois divergentes deixa o campo sem saber que ha versao nova."
            exit 1
          fi

      - name: Restaurar o keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o secret SPE_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spe-coleta.jks"

      - name: Gerar o projeto nativo
        env:
          SPE_KEYSTORE_ARQUIVO: ${{ runner.temp }}/spe-coleta.jks
          # versionCode monotonico: o Android recusa instalar por cima de um
          # numero maior, e run_number nunca repete no repositorio.
          SPE_VERSION_CODE: ${{ github.run_number }}
          # Host do App Link, gravado no AndroidManifest pelo app.config.js. Sem
          # ela o APK sai sem o filtro e o link de coleta abre no navegador, que
          # e o comportamento antigo — nao quebra nada, so perde o atalho.
          SPE_PAINEL_URL: ${{ vars.SPE_PAINEL_URL }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar o APK assinado
        env:
          # Lido pelo bundle durante o assembleRelease. Sem HTTPS o proprio
          # aplicativo se recusa a subir (src/config/ambiente.ts).
          EXPO_PUBLIC_API_URL: ${{ vars.SPE_API_URL }}
          SPE_KEYSTORE_ARQUIVO: ${{ runner.temp }}/spe-coleta.jks
          SPE_KEYSTORE_SENHA: ${{ secrets.SPE_KEYSTORE_SENHA }}
          SPE_KEYSTORE_ALIAS: ${{ secrets.SPE_KEYSTORE_ALIAS }}
          SPE_KEYSTORE_SENHA_CHAVE: ${{ secrets.SPE_KEYSTORE_SENHA_CHAVE }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Falta a variavel SPE_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Conferir a assinatura e calcular o SHA-256
        id: arquivo
        run: |
          origem=android/app/build/outputs/apk/release/app-release.apk
          versao=$(node -p "require('./app.json').expo.version")
          destino="spe-coleta-$versao.apk"
          cp "$origem" "$destino"

          # Rede de seguranca: se o plugin de assinatura nao tivesse agido, o APK
          # sairia com a chave de debug do Android e seria impossivel atualizar
          # depois. Melhor falhar aqui do que descobrir em campo.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs "$destino" | tee assinatura.txt
          if grep -qi "CN=Android Debug" assinatura.txt; then
            echo "::error::O APK saiu assinado com a chave de debug."
            exit 1
          fi

          # Impressao digital do certificado que assinou o APK. E o que vai no
          # assetlinks.json do painel (SPE_APP_FINGERPRINT): sem ela batendo, o
          # Android nao liga o App Link e o link de coleta abre no navegador.
          # O apksigner imprime hexadecimal continuo e minusculo; o formato que
          # o assetlinks.json espera e maiusculo, em pares separados por ":".
          digito=$(grep -i 'certificate SHA-256 digest' assinatura.txt | head -1 | awk '{print $NF}')
          impressao=$(echo "$digito" | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')

          {
            echo "versao=$versao"
            echo "nome=$destino"
            echo "sha256=$(sha256sum "$destino" | cut -d' ' -f1)"
            echo "impressao=$impressao"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.arquivo.outputs.nome }}
          path: apps/app/${{ steps.arquivo.outputs.nome }}

      - name: Publicar no Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.arquivo.outputs.versao }}
          NOME: ${{ steps.arquivo.outputs.nome }}
          SHA256: ${{ steps.arquivo.outputs.sha256 }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          {
            printf 'Como instalar e como conferir o arquivo: veja a pagina de download.\n\n'
            printf '| | |\n|---|---|\n'
            printf '| Versao | %s |\n' "$VERSAO"
            printf '| versionCode | %s |\n' "$VERSION_CODE"
            printf '| SHA-256 | `%s` |\n\n' "$SHA256"
            printf 'Depois de publicar, ajuste na API: APP_VERSAO_ATUAL, APP_URL_APK (o\n'
            printf 'link do arquivo acima) e APP_APK_SHA256 com o hash desta tabela.\n'
          } > notas.md

          gh release create "$GITHUB_REF_NAME" "$NOME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aplicativo $VERSAO" \
            --notes-file notas.md

      - name: Resumo
        env:
          NOME: ${{ steps.arquivo.outputs.nome }}
          VERSAO: ${{ steps.arquivo.outputs.versao }}
          SHA256: ${{ steps.arquivo.outputs.sha256 }}
          VERSION_CODE: ${{ github.run_number }}
          API: ${{ vars.SPE_API_URL }}
          PAINEL: ${{ vars.SPE_PAINEL_URL }}
          IMPRESSAO: ${{ steps.arquivo.outputs.impressao }}
        run: |
          {
            printf '### APK gerado\n\n'
            printf '| | |\n|---|---|\n'
            printf '| Arquivo | `%s` |\n' "$NOME"
            printf '| Versao | %s |\n' "$VERSAO"
            printf '| versionCode | %s |\n' "$VERSION_CODE"
            printf '| SHA-256 do arquivo | `%s` |\n' "$SHA256"
            printf '| API | `%s` |\n' "$API"
            printf '| Painel (App Link) | `%s` |\n\n' "${PAINEL:-nao configurado}"

            printf '#### Impressao digital da chave de assinatura\n\n'
            printf 'E o valor de `SPE_APP_FINGERPRINT` no build do painel. Enquanto o painel\n'
            printf 'publicado nao declarar exatamente esta impressao, o link de coleta abre no\n'
            printf 'navegador em vez de abrir o aplicativo.\n\n'
            printf '```\n%s\n```\n' "$IMPRESSAO"
          } >> "$GITHUB_STEP_SUMMARY"
