name: spe-hml

services:
  db:
    image: postgres:16-alpine
    container_name: spe-hml-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      TZ: America/Bahia
    volumes:
      - dados-postgres-hml:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      target: production
    container_name: spe-hml-api
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      DEVICE_HASH_PEPPER: ${DEVICE_HASH_PEPPER:?defina DEVICE_HASH_PEPPER}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      SESSAO_INATIVIDADE_MIN: ${SESSAO_INATIVIDADE_MIN:-30}
      SESSAO_ABSOLUTA_HORAS: ${SESSAO_ABSOLUTA_HORAS:-8}
      # O TLS termina no proxy; a API recusa requisição que chegue em texto claro.
      TLS_OBRIGATORIO: 'true'
      # URL publica do painel: e a unica pagina que o renderizador de PDF abre.
      # Precisa ser a mesma origem que os usuarios acessam, senao o navegador do
      # PDF cai no CORS da API e no VITE_API_URL embutido no build.
      PAINEL_URL: ${PAINEL_URL:?defina PAINEL_URL}
      EXPORTACAO_PDF_HABILITADO: ${EXPORTACAO_PDF_HABILITADO:-false}
      EXPORTACAO_PDF_TIMEOUT_MS: ${EXPORTACAO_PDF_TIMEOUT_MS:-45000}
      EXPORTACAO_THROTTLE_LIMITE: ${EXPORTACAO_THROTTLE_LIMITE:-6}
      EXPORTACAO_PDF_TLS_INVALIDO: ${EXPORTACAO_PDF_TLS_INVALIDO:-false}
      # Verificacao anti-robo. Em producao TURNSTILE_OBRIGATORIO precisa ser
      # true — ver o checklist de docs/homologacao.md.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_OBRIGATORIO: ${TURNSTILE_OBRIGATORIO:-false}
      TURNSTILE_EXIGIR_NO_APLICATIVO: ${TURNSTILE_EXIGIR_NO_APLICATIVO:-false}
      # Distribuicao do APK: o que a pagina de download e o aplicativo leem em
      # GET /aplicativo/versao. Sem isso, publicar uma versao nova exigiria
      # editar este arquivo a mao.
      APP_VERSAO_ATUAL: ${APP_VERSAO_ATUAL:-0.1.0}
      APP_VERSAO_MINIMA: ${APP_VERSAO_MINIMA:-0.1.0}
      # Sem valor cai na pagina servida pelo proprio painel: env.config usa `??`
      # nesta variavel, entao string vazia viraria URL vazia, nao o padrao.
      APP_URL_DOWNLOAD: ${APP_URL_DOWNLOAD:-https://localhost/download.html}
      APP_URL_APK: ${APP_URL_APK:-}
      APP_APK_SHA256: ${APP_APK_SHA256:-}
      APP_NOTAS_DA_VERSAO: ${APP_NOTAS_DA_VERSAO:-}
      # Ciclo da agregacao que alimenta o painel. O refresh e CONCURRENTLY, entao
      # ciclo curto nao trava leitura — mas cada ciclo recalcula as views
      # inteiras. Volume baixo pede ciclo curto; teste de carga pede o contrario.
      AGREGACAO_INTERVALO_MIN: ${AGREGACAO_INTERVALO_MIN:-10}
      # Expurgo (LGPD). EXPURGO_ANOS muda por decisao de conformidade, nao por
      # ajuste de operacao.
      EXPURGO_ANOS: ${EXPURGO_ANOS:-4}
      EXPURGO_INTERVALO_HORAS: ${EXPURGO_INTERVALO_HORAS:-24}
      EXPURGO_LOTE: ${EXPURGO_LOTE:-1000}
      EXPURGO_LOTES_POR_CICLO: ${EXPURGO_LOTES_POR_CICLO:-20}
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  painel:
    build:
      context: ../apps/painel
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:?defina VITE_API_URL}
    container_name: spe-hml-painel
    expose:
      - '80'
    depends_on:
      - api
    restart: unless-stopped

  # Tarefas pontuais de operacao (seed, criar-admin, popular-carga). Fica atras
  # do profile `tarefas`: nao sobe com `up`, so quando chamado de proposito com
  # `docker compose --profile tarefas run --rm tarefas <comando>`. Roda na mesma
  # rede do banco, o que evita publicar a porta 5432 so para rodar script.
  tarefas:
    build:
      context: ../apps/api
      target: tarefas
    profiles: ['tarefas']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  # Backup periodico da base. Sem cron no host: o proprio container agenda.
  # Restauracao nunca e automatica — ver infra/scripts/restaurar-postgres.sh.
  backup:
    image: postgres:16-alpine
    container_name: spe-hml-backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVALO_HORAS: ${BACKUP_INTERVALO_HORAS:-6}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      TZ: America/Bahia
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ./scripts/restaurar-postgres.sh:/usr/local/bin/restaurar-postgres.sh:ro
      - dados-backup:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-postgres.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Único serviço publicado: termina o TLS e repassa X-Forwarded-Proto.
  # API e painel não ficam expostos diretamente.
  proxy:
    image: nginx:1.27-alpine
    container_name: spe-hml-proxy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificados:/etc/nginx/certificados:ro
      - dados-certbot:/var/www/certbot
    depends_on:
      - api
      - painel
    restart: unless-stopped

volumes:
  dados-postgres-hml:
  dados-certbot:
  dados-backup:
