name: spe-dev

services:
  db:
    image: postgres:16-alpine
    container_name: spe-dev-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spe}
      POSTGRES_DB: ${POSTGRES_DB:-spe_dev}
      TZ: America/Bahia
    ports:
      - '5432:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-spe} -d ${POSTGRES_DB:-spe_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      target: development
    container_name: spe-dev-api
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-spe}:${POSTGRES_PASSWORD:-spe}@db:5432/${POSTGRES_DB:-spe_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:-segredo-de-desenvolvimento-com-32-caracteres}
      TLS_OBRIGATORIO: "false"
      CORS_ORIGINS: http://localhost:5173
    ports:
      - '3000:3000'
    volumes:
      - ../apps/api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-postgres:
